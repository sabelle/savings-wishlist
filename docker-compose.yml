services:
  db:
    image: postgres:18
    container_name: myapp-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: myapp
      POSTGRES_PASSWORD: "1234"
      POSTGRES_DB: myapp

    ports:
      - "127.0.0.1:5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U myapp -d myapp"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: